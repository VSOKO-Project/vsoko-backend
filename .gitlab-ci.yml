stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - docker:27.5.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - dotnet test vsoko.sln
  coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: tests/*/coverage.cobertura.xml

build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker buildx create --use --driver docker-container --driver-opt network=host
    - docker buildx build --pull --provenance=false --sbom=false
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max
        -t $DOCKER_IMAGE_NAME --push .
  only:
    - main

deploy:
  stage: deploy
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  resource_group: vsoko-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Применить миграции и обновить API в production?"
  timeout: 40m
  script:
    - kubectl config use-context vsoko/vsoko-infra:vsoko
    - sed -i "s/REPLACE_WITH_COMMIT_SHA/$CI_COMMIT_SHA/g" k8s/kustomization.yaml k8s/migration-job.yaml
    - kubectl apply --dry-run=server -k k8s/
    - kubectl -n vsoko apply -f k8s/secrets/store.yaml
    - kubectl -n vsoko wait --for=condition=Ready secretstore/gitlab-vsoko-api --timeout=120s
    - kubectl -n vsoko apply -f k8s/secrets/external-secrets.yaml
    - kubectl -n vsoko wait --for=condition=Ready externalsecret/postgres-app externalsecret/redis externalsecret/vsoko-api externalsecret/gitlab-registry --timeout=120s
    - kubectl -n vsoko get secret postgres-app redis vsoko-api gitlab-registry -o name
    - kubectl -n vsoko apply -f k8s/service.yaml -f k8s/ingress.yaml
    - kubectl -n vsoko wait --for=create certificate/vsoko-api-tls --timeout=60s
    - kubectl -n vsoko wait --for=condition=Ready certificate/vsoko-api-tls --timeout=600s
    - kubectl -n vsoko delete job vsoko-api-migrate --ignore-not-found --wait=true --timeout=60s
    - kubectl create -f k8s/migration-job.yaml
    - |
      if ! kubectl -n vsoko wait --for=condition=Complete job/vsoko-api-migrate --timeout=660s; then
        kubectl -n vsoko logs job/vsoko-api-migrate --all-containers=true || true
        exit 1
      fi
    - kubectl -n vsoko logs job/vsoko-api-migrate
    - kubectl apply -k k8s/
    - kubectl -n vsoko rollout status deployment/vsoko-api --timeout=600s
