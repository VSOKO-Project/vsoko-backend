stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker builder prune -af
    - docker build --pull -t $DOCKER_IMAGE_NAME .
    - docker push $DOCKER_IMAGE_NAME
  only:
    - main
    - stage

.deploy_template:
  stage: deploy
  image: docker:27.5.0
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tPort $TARGET_PORT" > ~/.ssh/config
    - docker context create remote-target --docker "host=ssh://$TARGET_USER@$TARGET_HOST"
  script:
    - ssh $TARGET_USER@$TARGET_HOST "mkdir -p $INFRA_PATH"
    - scp docker-compose.yml $TARGET_USER@$TARGET_HOST:$INFRA_PATH/docker-compose.yml
    - scp $TARGET_ENV_FILE $TARGET_USER@$TARGET_HOST:$INFRA_PATH/.env
    - ssh $TARGET_USER@$TARGET_HOST "
        export DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME &&
        cd $INFRA_PATH &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        (docker network inspect web_network >/dev/null 2>&1 || docker network create web_network || docker network inspect web_network >/dev/null) &&
        docker compose pull &&
        docker compose up -d --no-build --remove-orphans &&
        docker image prune -f
      "

deploy_stage:
  extends: .deploy_template
  variables:
    INFRA_PATH: "$BASE_DEPLOY_PATH/vsoko-api"
    TARGET_PORT: $SSH_PORT_STAGE
    TARGET_HOST: $SSH_HOST_STAGE
    TARGET_USER: $SSH_USER_STAGE
    TARGET_ENV_FILE: $STAGE_ENV_FILE
  environment:
    name: staging
  only:
    - stage

deploy_prod:
  extends: .deploy_template
  variables:
    INFRA_PATH: "$BASE_DEPLOY_PATH/vsoko-api"
    TARGET_PORT: $SSH_PORT_PROD
    TARGET_HOST: $SSH_HOST_PROD
    TARGET_USER: $SSH_USER_PROD
    TARGET_ENV_FILE: $PROD_ENV_FILE
  environment:
    name: production
  only:
    - main
