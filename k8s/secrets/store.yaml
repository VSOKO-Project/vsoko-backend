apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gitlab-vsoko-api
  namespace: vsoko
spec:
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "79324135"
      environment: "*"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-token
            key: token
