apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vsoko-api
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-vsoko-api
    kind: SecretStore
  target:
    name: vsoko-api
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: jwt-secret-key
      remoteRef:
        key: JWT_SECRET_KEY
    - secretKey: openrouter-api-key
      remoteRef:
        key: OPENROUTER_API_KEY
