title = "VSOKO reviewed test fixture exceptions"
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic JWT signing key used only by the integration test server"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)tests/Api\.IntegrationTests/Support/ApiFactory\.cs$''']
regexTarget = "secret"
regexes = ['''^integration-tests-secret-key-0123456789-abcdef$''']
